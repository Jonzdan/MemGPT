[tool.poetry]
name = "pymemgpt"
version = "0.3.16"
description = "Teaching LLMs memory management for unbounded context"
authors = ["MemGPT Team <team@memgpt.ai>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{include = "memgpt"}]

[tool.poetry.dependencies]
python = "<3.12,>=3.10"
# Core dependencies pinned to fix the version solving loop
pydantic = "1.10.15"
sqlalchemy = { version = "1.4.41", extras = ["asyncio"] }
sqlmodel = "0.0.8"
# Standard dependencies
typer = {extras = ["all"], version = "^0.9.0"}
requests = "^2.31.0"
numpy = "^1.26.2"
tqdm = "^4.66.1"
pytz = "^2023.3.post1"
python-dotenv = "^1.0.0"
openai = "^1.14.3"
tiktoken = "^0.5.1"
questionary = "^2.0.1"
prettytable = "^3.9.0"
demjson3 = "^3.0.6"
pyyaml = "^6.0.1"
pycryptodome = "^3.19.0"
fastapi = "^0.104.1"
uvicorn = "^0.24.0.post1"
websockets = "^12.0"
httpx = "^0.25.2"
pip = "^23.3.1"
setuptools = "^68.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
isort = "^5.12.0"
autoflake = "^2.2.1"
pre-commit = "^3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
memgpt = "memgpt.main:app"
